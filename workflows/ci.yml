name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate TaskFlow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required application files exist."

      - name: Validate HTML
        run: |
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          echo "HTML structure check passed."

      - name: Validate JavaScript syntax
        run: |
          node --check script.js

      - name: Check Dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "Dockerfile found."
          else
            echo "Dockerfile not found yet; skipping Docker check."
          fi
